# Signal Check configuration.
# Every threshold used by the engine lives here (COPILOT_BRIEF.md sections 5-7).
# Engine code must read these values; never hard-code them.
# Frequency-keyed maps use D (daily), W (weekly), M (monthly).

sources:
  csv: true
  google_trends: true
  reddit: true
  wikipedia: true
  hackernews: true
  x: false # also gated by the ENABLE_X env var and X_MAX_SPEND_USD budget

http:
  connect_timeout_s: 5
  read_timeout_s: 20
  max_retries: 4
  backoff_base_s: 1.0
  backoff_max_s: 30.0

cache:
  ttl_hours: 6
  dir: .cache/signalcheck

adapters:
  csv:
    # Google Trends reports tiny interest as "<1"; such cells get this value and imputed=True.
    trends_lt1_value: 0.5
  # Live adapters (Phase 4). Paths are relative to the repo root. History lengths are in days.
  wikipedia:
    project: en.wikipedia
    access: all-access
    # "user" excludes traffic Wikimedia classifies as spiders or automated.
    agent: user
    # >= 730 daily points so the annual seasonality check can run.
    history_days: 800
    # Search candidates offered for the article override.
    search_limit: 5
  hackernews:
    history_days: 90
    # Algolia tags filter: stories and comments.
    tags: "(story,comment)"
    # false = exact word matching, so day counts and breadth hits use the same matching.
    typo_tolerance: false
    # Algolia returns at most 1,000 hits per query (paginationLimitedTo).
    max_hits_per_day: 1000
    # Minimum seconds between requests (Algolia allows 10,000 requests/hour per IP).
    min_interval_s: 0.1
  google_trends:
    # Try the optional live fetcher (pytrends, if installed) before the snapshot.
    live_enabled: true
    # Google picks granularity from the timeframe: <= daily_max_days -> daily, <= weekly_max_days -> weekly.
    timeframe_days: 90
    daily_max_days: 90
    weekly_max_days: 1825
    geo: ""
    snapshot_dir: data/samples/google_trends
    # Add a "snapshot is stale" caveat when older than this.
    snapshot_stale_days: 14
  reddit:
    history_days: 30
    # Reddit listings return at most 100 items per page and search stops at ~1,000 results.
    page_limit: 100
    result_cap: 1000
    # 100 queries/minute per OAuth client -> at least 0.6 s between requests.
    min_interval_s: 0.6
    collected_dir: data/collected/reddit
    # Days the daily collector re-fetches (and upserts) on each run.
    collect_days: 7
    # Topics the daily collector (scripts/collect_reddit.py) accumulates history for.
    watchlist: ["perplexity ai", "chatgpt", "claude ai", "rust programming", "nvidia"]
  x:
    # Counts endpoint: "all" (full archive, pay-per-use) or "recent" (last 7 days only).
    counts_endpoint: all
    history_days: 90
    # Appended to every query so reposts do not inflate counts.
    query_suffix: "-is:retweet"
    # USD per request (counts) or per post returned (post reads); see docs.x.com pricing.
    cost_counts_recent_usd: 0.005
    cost_counts_all_usd: 0.010
    cost_post_read_usd: 0.005
    # Days per counts/all page at day granularity.
    counts_all_page_days: 31
    # Budget when X_MAX_SPEND_USD is unset.
    default_max_spend_usd: 5.0
    # Spend ledger file name inside cache.dir (gitignored).
    ledger_file: x_spend_ledger.json
    # Optional breadth from post reads (search/recent, last 7 days only) on the engine's recent
    # window: newest N posts per day, each billed at cost_post_read_usd.
    breadth_enabled: false
    breadth_posts_per_day: 20

# Topics refreshed by scripts/refresh_samples.py into data/samples/<source>/<slug>.json.
samples:
  dir: data/samples
  topics: ["perplexity ai", "chatgpt", "taylor swift", "rust programming"]

# Section 5: preprocessing
preprocess:
  # Minimum points of history; fewer -> INCONCLUSIVE (R1).
  min_history: {D: 28, W: 26, M: 24}
  # Recent window = clamp(round(recent_frac * n), recent_min[freq], recent_max[freq]).
  recent_frac: 0.2
  recent_min: {D: 7, W: 4, M: 3}
  recent_max: {D: 28, W: 13, M: 6}
  # Linear gap fill only when a check needs a regular series, at most this many consecutive points.
  gap_fill_max_consecutive: 2
  # Scale factor making MAD a consistent estimator of the normal standard deviation.
  mad_scale: 1.4826
  # If MAD == 0, use max(MAD, mad_floor * max(median, 1)).
  mad_floor: 0.05
  # Scales analysed on log1p(values); every other scale is analysed as-is.
  log_scales: [count, pageviews]

# Section 6: checks
checks:
  persistence:
    # Baseline points prepended to the recent window for the trend test.
    persistence_context: 7
    # Use the Hamed-Rao autocorrelation-corrected Mann-Kendall test at or above this n.
    hamed_rao_min_n: 10
    # Mann-Kendall significance level.
    mk_alpha: 0.05
    # Minimum |Theil-Sen slope| as a fraction of baseline level per period (0.02 = 2%).
    min_slope: 0.02
    # Band (in MADs around baseline median) for counting consecutive recent exceedances.
    band_mads: 2.0
    # Fewest observed points the trend test will run on; fewer -> skipped.
    min_points: 5
    # Identity scale: slope is normalised by max(|baseline median|, slope_level_floor).
    slope_level_floor: 1.0
  concentration:
    # Skip unless |sum of excess| >= excess_min_mads * MAD * n_recent.
    excess_min_mads: 1.0
    # Fluke if the top period carries >= this share of directional excess.
    conc_top1_max: 0.6
    # Fluke if the top two periods carry >= this share of directional excess.
    conc_top2_max: 0.8
  seasonality:
    # Day-of-week STL period (nuisance removal only, never a SEASONAL verdict).
    weekly_period: 7
    # Minimum weeks of daily data before removing day-of-week effects.
    weekly_min_weeks: 2
    # Annual seasonality needs >= 2 full years of points.
    annual_min_points: {D: 730, W: 104, M: 24}
    # Annual STL period per frequency (daily data is aggregated to weekly first).
    annual_period: {D: 52, W: 52, M: 12}
    stl_robust: true
    # STL seasonal smoother degree: 0 averages each phase across years (near-periodic),
    # which keeps a recent step or trend from being absorbed as "seasonal" with few cycles.
    stl_seasonal_deg: 0
    # Skip unless |rise| >= excess_min_mads * MAD.
    excess_min_mads: 1.0
  outliers:
    # Flag recent points with |robust z| >= outlier_z.
    outlier_z: 3.5
    # At most this many flagged recent points count as isolated spikes (supports fluke);
    # more flagged points mean the whole window moved, which other checks judge.
    isolated_max_points: 2
  level_shift:
    # PELT penalty = pen_beta * log(n) on the robust-standardised series.
    pen_beta: 3.0
    # Minimum periods a new level must hold (also PELT min_size).
    min_persist: {D: 7, W: 3, M: 2}
    # Share of post-change points that must sit on the new side of the midpoint.
    hold_fraction: 0.8
    # A change point up to this many periods before the recent window counts as "just before".
    recent_tolerance: {D: 7, W: 3, M: 2}
  low_count:
    # Active when baseline mean per bucket is below this (count series only).
    low_count_threshold: 5.0
    # Confidence level for the rate-ratio interval.
    ci_level: 0.95
  breadth:
    # Fluke if volume-weighted mean top_share over the recent window >= this.
    breadth_top_share_max: 0.5
    # Fluke if recent contributors per item fall below this ratio.
    breadth_min_contrib_ratio: 0.3

# Rounding used in Evidence.summary / Evidence.numbers (the narration validator
# matches narrated numbers against these displayed values).
display:
  value_decimals: 1 # values on the original scale (medians, bands, levels)
  pct_decimals: 1 # percentages (slopes, shares)
  stat_decimals: 2 # z-scores, rate ratios and their intervals, penalties
  p_decimals: 3 # p-values; smaller ones are shown as "p < 0.001"

# Section 7: verdict, confidence, cross-source
verdict:
  # R2: seasonal share of the recent rise needed to call SEASONAL.
  seasonal_explained_min: 0.7
  # R3 gap: on log-scale series a single spike often leaves too little total excess for the
  # concentration check to run ("no meaningful excess"). When true, isolated outliers
  # (at most checks.outliers.isolated_max_points flagged) stand in for concentration's fluke
  # signal in that case, provided there is no trend and no sustained level shift.
  fluke_from_isolated_outliers: true

confidence:
  # score = agreeing checks - contradicting checks - penalties (section 7).
  conf_high: 3
  conf_medium: 1
  # Penalise when history < history_multiple * min_history.
  history_multiple: 2

# Section 8: "what would change my mind" conditions, in MADs on the working scale.
change_my_mind:
  # FLUKE (and INCONCLUSIVE): the next min_persist periods beyond median +/- exceed_mads * MAD
  # would make it a trend.
  exceed_mads: 2.0
  # TREND (and INCONCLUSIVE): the next min_persist periods back within median +/- fallback_mads
  # * MAD would make it a fluke.
  fallback_mads: 1.0
  # SEASONAL: next period beyond last year's same-period value by this many MADs.
  seasonal_excess_mads: 2.0
  # At most this many conditions per verdict.
  max_conditions: 3

eval:
  # Thresholds are tuned to keep the false-TREND rate on pure noise at or below this.
  target_false_trend_rate: 0.05

cross_source:
  # Sources whose recent window overlaps the comparison window less than this are "not comparable".
  min_overlap: 0.5

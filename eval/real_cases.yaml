# Real events for the eval, labelled BEFORE the engine was run on them (pre-registered).
#
# Labels come from world knowledge of what happened (with hindsight), never from the engine's
# output. They were committed together with the data snapshots, before any verdict was computed,
# and are not changed afterwards: if a label looks wrong once results are known, it stays and the
# disagreement is noted in eval/TUNING_LOG.md. Every label is agent-assigned and awaits human review.
#
# Data are aggregate-only JSON snapshots (same format as data/samples/) written by
# `python -m eval.fetch_real` into eval/real_data/<id>.json. Wikipedia uses agent=user pageviews;
# Hacker News uses daily story+comment counts (breadth on the recent window). Weekly cases are
# Monday-Sunday sums of the daily pageviews.
#
#   id           unique case id (snake case); the snapshot is real_data/<id>.json
#   source       wikipedia | hackernews (live adapter used by eval/fetch_real.py)
#   query        topic passed to the adapter
#   article      Wikipedia article override (exact title), null for other sources
#   freq         D | W (W = Monday-Sunday weekly sums of the daily data)
#   start        first day fetched (a Monday for weekly cases)
#   end          last day fetched; days after as_of are hindsight for reviewers only
#   as_of        the engine sees data up to and including this day (a Sunday for weekly cases),
#                chosen so the event sits in the recent window
#   label        TREND | FLUKE | SEASONAL | NO_CHANGE | INCONCLUSIVE
#   direction    up | down for TREND, else null
#   split        tune | test (stratified ~50/50 by label; thresholds are never tuned on test)
#   event_date   ISO date of the real-world event behind the movement (if any)
#   rationale    one line: why this label
#   labelled_on  date the label was assigned
#   labelled_by  who assigned it

cases:

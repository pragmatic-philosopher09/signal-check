    article: null
    freq: D
    start: "2022-10-01"
    end: "2022-12-31"
    as_of: "2022-12-31"
    label: TREND
    direction: up
    split: tune
    event_date: "2022-11-30"
    rationale: >-
      ChatGPT launched on 30 Nov 2022 and HN discussion of it went from zero to a sustained,
      growing daily volume that kept rising through 2023; a lasting rise, not a one-off spike.
    labelled_on: "2026-10-03"
    labelled_by: agent (pending human review)


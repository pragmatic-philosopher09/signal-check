# Daily Reddit collector (COPILOT_BRIEF.md section 4): appends per-day aggregates for the
# watchlist in config.yaml (adapters.reddit.watchlist) to data/collected/reddit/<slug>.csv
# and commits them. Aggregates only (date, count, contributors, top_share); no author
# names or post text are written.
#
# Disabled until secrets exist: every step after the guard is skipped unless the
# repository secret REDDIT_CLIENT_ID is set. Repository secrets used
# (Settings -> Secrets and variables -> Actions):
#   REDDIT_CLIENT_ID          required - Reddit app (type "script" or "web") client id
#   REDDIT_CLIENT_SECRET      required - Reddit app secret
#   REDDIT_USERNAME           optional - appended to the User-Agent as "(by /u/<name>)"
#   SIGNALCHECK_CONTACT_EMAIL optional - contact address in the User-Agent
name: Collect Reddit

on:
  schedule:
    - cron: "17 2 * * *" # daily, 02:17 UTC (yesterday is a complete UTC day)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-reddit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
      SIGNALCHECK_CONTACT_EMAIL: ${{ secrets.SIGNALCHECK_CONTACT_EMAIL }}
    steps:
      - name: Check credentials
        id: guard
        run: |
          if [ -n "$REDDIT_CLIENT_ID" ] && [ -n "$REDDIT_CLIENT_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Reddit secrets not configured; collector skipped."
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.enabled == 'true'
      - uses: actions/setup-python@v7
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Collect
        if: steps.guard.outputs.enabled == 'true'
        run: python -m scripts.collect_reddit
      - name: Commit aggregates
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/collected/reddit/
          if git diff --cached --quiet; then
            echo "No new aggregates."
            exit 0
          fi
          git commit -m "Collect Reddit aggregates $(date -u +%F)"
          git push

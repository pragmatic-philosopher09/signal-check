# Daily data refresh (no server): fetches the config.yaml watchlist through the Python
# adapters, rewrites one aggregate-only snapshot per topic x source in data/samples/
# (merged with earlier history), appends Reddit day aggregates to data/collected/reddit/,
# writes data/manifest.json, commits if anything changed, then rebuilds and redeploys
# GitHub Pages so the precomputed verdicts and the "Data refreshed" line update.
#
# Sources: Wikipedia and Hacker News (keyless). Reddit only when its secrets exist
# (Settings -> Secrets and variables -> Actions):
#   REDDIT_CLIENT_ID          Reddit app client id
#   REDDIT_CLIENT_SECRET      Reddit app secret
#   REDDIT_USERNAME           optional - appended to the User-Agent as "(by /u/<name>)"
#   SIGNALCHECK_CONTACT_EMAIL optional - contact address in the User-Agent
# X is never used here. Google Trends has no API; see scripts/refresh_trends_local.sh.
#
# GitHub disables scheduled workflows after 60 days without repository activity in
# public repos; re-enable with `gh workflow enable refresh.yml` (see README).
name: Refresh data

on:
  schedule:
    - cron: "30 2 * * *" # daily, 02:30 UTC (yesterday is a complete UTC day)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One refresh at a time. The deploy job reuses pages.yml, whose own `pages` group
# serialises it with deploys triggered by pushes to main.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
      SIGNALCHECK_CONTACT_EMAIL: ${{ secrets.SIGNALCHECK_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Writes a topic x source table to the step summary. Exits non-zero only when
      # every attempted source failed (previous snapshots are kept on failure).
      - name: Refresh watchlist
        run: python -m scripts.refresh_data
      - name: Commit changed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/samples/ data/collected/ data/manifest.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -q -m "Refresh data $(date -u +%F) [skip ci]"
            git pull -q --rebase origin "${GITHUB_REF_NAME}"
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}

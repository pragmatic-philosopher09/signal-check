# Streamlit settings for Signal Check (secrets go in .streamlit/secrets.toml, never committed).
[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6f9"
textColor = "#1b1f24"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
